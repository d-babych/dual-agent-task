[agents]
spec_author = "claude"
spec_reviewer = "codex"
implementer = "codex"
code_reviewer = "claude"

[models]
spec_author = "sonnet"
spec_reviewer = "gpt-5.6-sol"
implementer = "gpt-5.6-sol"
code_reviewer = "sonnet"

[effort]
spec_author = "high"
spec_reviewer = "high"
implementer = "medium"
code_reviewer = "high"

[limits]
max_spec_rounds = 3
max_code_rounds = 3
agent_timeout_seconds = 1200

[git]
require_clean_worktree = true
allow_commits = false
allow_push = false

[verification]
commands = ["git diff --check"]

